  },
  setup() {
    const user = ref(null);
    const currentView = ref("home");
    const perfilAberto = ref(false);
    const deepLinkCalibracaoId = ref(null);

    // Deep link do QR Code impresso na etiqueta do instrumento
    // (#calibracao/<id>, ver `gerarUrlInstrumento`): ao escanear pelo celular,
    // a própria URL abre a tela de Calibração já na ficha completa do
    // instrumento. Funciona antes ou depois do login — o hash é lido uma
    // única vez no mount e removido da URL para não reabrir a ficha em
    // navegações futuras dentro da mesma sessão.
    function consumirDeepLinkCalibracao() {
      const id = extrairIdCalibracaoDoHash(location.hash);
      if (!id) return;
      deepLinkCalibracaoId.value = id;
      currentView.value = "calibracao";
      history.replaceState(null, "", location.pathname + location.search);
    }

    // Blindagem contra tela em branco: qualquer erro de renderização/lifecycle
    // não tratado num módulo (ex: propriedade undefined vinda da planilha) é
    // capturado aqui em vez de derrubar a árvore inteira do Vue.
    const erroRenderizacao = ref(null);
    onErrorCaptured((err, instance, info) => {
      console.error("Erro de renderização capturado:", err, info);
      erroRenderizacao.value = (err && err.message) || "Erro inesperado ao carregar esta tela.";
      return false;
    });
    function tentarNovamenteRenderizacao() {
      erroRenderizacao.value = null;
      currentView.value = "home";
    }

    onMounted(() => {
      try {
        const stored = localStorage.getItem(STORAGE_USER_KEY);
        if (stored) user.value = JSON.parse(stored);
      } catch (e) {
        localStorage.removeItem(STORAGE_USER_KEY);
      }
      consumirDeepLinkCalibracao();
    });

    function handleLoginSuccess(u) {
      user.value = u;
      // Preserva a navegação para a ficha do instrumento quando o login foi
      // disparado por um QR Code escaneado antes de o usuário estar logado.
      if (!deepLinkCalibracaoId.value) currentView.value = "home";
    }

    function logout() {
      localStorage.removeItem(STORAGE_USER_KEY);
      user.value = null;
      currentView.value = "home";
      pushToast("Sessão encerrada.", "info");
    }

    // Navegação interna vinda da tabela "Ação Imediata & Auditoria" do
    // Dashboard Metrológico (Indicadores ▸ Calibração & SGQ): reaproveita o
    // mesmo mecanismo do deep link do QR Code para abrir a ficha completa do
    // instrumento direto na Calibração & Medição, sem precisar de URL/hash.
    function abrirInstrumentoCalibracao(id) {
      deepLinkCalibracaoId.value = id;
      currentView.value = "calibracao";
    }

    function irParaHome() {
      erroRenderizacao.value = null;
      currentView.value = "home";
    }

    function navigate(view) {
      erroRenderizacao.value = null;
      // Gestão de Usuários é exclusiva do perfil Administrador — bloqueia
      // mesmo que a navegação seja disparada por outro caminho além do card
      // (o HomeHub já nem exibe o card para quem não é admin).
      if (view === "usuarios" && !isAdmin(user.value)) {
        pushToast("Apenas administradores podem acessar a Gestão de Usuários.", "error");
        return;
      }
      if (view === "cadastros" && !isAdmin(user.value)) {
        pushToast("Apenas administradores podem acessar a Central de Cadastros Mestres.", "error");
        return;
      }
      currentView.value = view;
    }

    function abrirPerfil() {
      perfilAberto.value = true;
    }
    function fecharPerfil() {
      perfilAberto.value = false;
    }

    const titulosModulo = {
      preventiva: "Manutenção Preventiva",
      corretiva: "Manutenção Corretiva",
      indicadores: "Indicadores (KPIs)",
      dashboard: "Dashboard Geral",
      calibracao: "Calibração & Medição",
      ativos: "Gestão de Ativos",
      usuarios: "Gestão de Usuários",
      rnc: "Registro de Desvios e Problemas (RNC)",
      cadastros: "Central de Cadastros Mestres",
    };
    const currentTitle = computed(() => titulosModulo[currentView.value] || "");

    const cargoBadgeClass = computed(() => {
      const c = ((user.value && user.value.cargo) || "").toLowerCase();
      if (c.includes("admin")) return "bg-indigo-500/20 text-indigo-300 ring-1 ring-indigo-400/40";
      if (c.includes("manuten")) return "bg-sky-500/20 text-sky-300 ring-1 ring-sky-400/40";
      return "bg-slate-500/20 text-slate-300 ring-1 ring-slate-400/40";
    });

    // Acesso rápido à Central de Cadastros Mestres a partir de qualquer tela
    // (o app não tem um menu lateral fixo — a navegação é toda por cards no
    // HomeHub — então este botão no cabeçalho cumpre o mesmo papel de um
    // atalho sempre visível, complementando o card já existente na Home).
    const souAdminApp = computed(() => isAdmin(user.value));

    return {
      user, currentView, handleLoginSuccess, logout, irParaHome, navigate, currentTitle, cargoBadgeClass,
      erroRenderizacao, tentarNovamenteRenderizacao, perfilAberto, abrirPerfil, fecharPerfil,
      deepLinkCalibracaoId, abrirInstrumentoCalibracao, souAdminApp,
    };

            @abrir-id-consumido="deepLinkCalibracaoId = null" key="calib"></calibracao-module>
          <gestao-ativos-module v-else-if="currentView === 'ativos'" key="ativos"></gestao-ativos-module>
          <gestao-usuarios-module v-else-if="currentView === 'usuarios' && user && user.perfil === 'Administrador'" key="usuarios"></gestao-usuarios-module>
          <cadastros-mestres-module v-else-if="currentView === 'cadastros' && user && user.perfil === 'Administrador'" :user="user" key="cadastros"></cadastros-mestres-module>
          <rnc-module v-else-if="currentView === 'rnc'" :user="user" key="rnc"></rnc-module>
          <dashboard-module v-else-if="currentView === 'dashboard'" @navigate="navigate" key="dash"></dashboard-module>
          <home-hub v-else :user="user" @navigate="navigate" @abrir-perfil="abrirPerfil" key="home-fallback"></home-hub>
        </transition>
      </main>
    </div>

    <meu-perfil-modal v-if="perfilAberto" :user="user" @fechar="fecharPerfil"></meu-perfil-modal>
  </div>`
};
createApp(App).mount("#app");
</script>
</body>
