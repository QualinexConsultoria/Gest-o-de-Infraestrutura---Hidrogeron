<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Hidrogeron | Gestão de Manutenção</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { font-family: 'Inter', system-ui, sans-serif; }
  html, body { -webkit-tap-highlight-color: transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  .fade-enter-active, .fade-leave-active { transition: opacity .15s ease; }
  .fade-enter-from, .fade-leave-to { opacity: 0; }
  .btn-tap { transition: transform .05s ease; }
  .btn-tap:active { transform: scale(0.96); }
  .spinner {
    width: 18px; height: 18px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.4); border-top-color: #fff;
    animation: spin .7s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
<div id="app"></div>

<script>
const { createApp, ref, reactive, computed, onMounted, watch } = Vue;

/* ==========================================================================
   CONFIGURAÇÃO
   ========================================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbxeM7DmvSrJW_uzm30LRwZsZnlQQO5MNwNzmC75dLd5lwJB1MFfZnQRIHuF2ihBl0_U/exec";
const STORAGE_USER_KEY = "hidrogeron_user";

const AREAS = ["Uso Geral", "Coating", "Metalmecânica", "Preparação", "Hidráulica", "Oficina"];
const PRIORIDADES = [
  { value: "Baixa",   color: "bg-blue-100 text-blue-700 border-blue-300" },
  { value: "Média",   color: "bg-yellow-100 text-yellow-700 border-yellow-300" },
  { value: "Alta",    color: "bg-orange-100 text-orange-700 border-orange-300" },
  { value: "Crítica", color: "bg-red-100 text-red-700 border-red-300" },
];

/* ==========================================================================
   HELPERS DE API
   O Apps Script Web App só dispensa o preflight de CORS se:
   - GET não enviar headers customizados;
   - POST usar Content-Type "text/plain;charset=utf-8" (nunca application/json);
   - as duas chamadas usarem redirect: "follow" (o /exec responde com um
     302 para script.googleusercontent.com que o fetch precisa seguir).
   ========================================================================== */
async function handleApiResponse(res) {
  if (!res.ok) {
    throw new Error("Falha na comunicação com o servidor (HTTP " + res.status + ")");
  }
  try {
    return await res.json();
  } catch (e) {
    throw new Error("Resposta inválida do servidor (não é um JSON válido).");
  }
}

// Wrapper genérico para qualquer ação via GET.
async function apiGet(params) {
  const qs = new URLSearchParams(params).toString();
  let res;
  try {
    res = await fetch(`${API_URL}?${qs}`, { method: "GET", redirect: "follow" });
  } catch (networkErr) {
    console.error("Erro de rede/CORS no GET:", networkErr);
    throw new Error("Não foi possível conectar ao servidor (rede ou CORS).");
  }
  return handleApiResponse(res);
}

// Chamada explícita usada para autenticação e carga inicial de dados.
async function getInitialData() {
  let res;
  try {
    res = await fetch(`${API_URL}?action=getInitialData`, {
      method: "GET",
      redirect: "follow",
    });
  } catch (networkErr) {
    console.error("Erro de rede/CORS no getInitialData:", networkErr);
    throw new Error("Não foi possível conectar ao servidor (rede ou CORS).");
  }
  const data = await handleApiResponse(res);
  console.log("Dados Carregados:", data);
  return data;
}

async function apiPost(payload) {
  let res;
  try {
    res = await fetch(API_URL, {
      method: "POST",
      redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
    });
  } catch (networkErr) {
    console.error("Erro de rede/CORS no POST:", networkErr);
    throw new Error("Não foi possível conectar ao servidor (rede ou CORS).");
  }
  return handleApiResponse(res);
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function nowISO() {
  return new Date().toISOString();
}

/* ==========================================================================
   NORMALIZAÇÃO DOS DADOS DA PLANILHA (aceita variações de nome de coluna)
   ========================================================================== */
function normalizePreventivaLog(p) {
  return {
    id: p.ID_Log || p.id_log || p.ID || p.id || uid(),
    data: p.Data_Hora || p.data_hora || p.Data || p.data || "",
    area: p.Area || p.area || "",
    equipamento: p.Equipamento || p.equipamento || "",
    usuario: p.Usuario || p.usuario || "",
    status: normalizeStatusInspecao(p.Status_Inspecao || p.status_inspecao || p.Status || p.status || ""),
    observacoes: p.Observacoes || p.observacoes || p.Obs || "",
  };
}

function normalizeCorretivaChamado(c) {
  return {
    id: c.ID_Chamado || c.id_chamado || c.ID || c.id || uid(),
    data: c.Data_Abertura || c.data_abertura || c.Data || c.data || "",
    area: c.Area || c.area || "",
    equipamento: c.Equipamento || c.equipamento || "",
    descricao: c.Descricao_Problema || c.descricao_problema || c.Descricao || "",
    prioridade: c.Prioridade || c.prioridade || "Média",
    solicitante: c.Solicitante || c.solicitante || "",
    status: c.Status_Chamado || c.status_chamado || c.Status || "Aberto",
    // Não fazem parte do schema original informado, mas são aproveitados se existirem
    // (preenchidos pelo fluxo de encerramento / usados no cálculo de MTTR).
    dataConclusao: c.DataConclusao || c.dataConclusao || c.DataFechamento || c.dataFechamento || c.DataResolucao || c.dataResolucao || "",
    resolucao: c.Resolucao || c.resolucao || c.Resolução || c.resolução || "",
    tecnico: c.Tecnico || c.tecnico || c.Técnico || c.técnico || "",
  };
}

function extractPreventivas(data) {
  const raw = data.preventivas || data.Preventivas || (data.data && data.data.preventivas) || [];
  return raw.map(normalizePreventivaLog);
}

function extractCorretivas(data) {
  const raw = data.chamados || data.Chamados || data.corretivas || data.Corretivas
    || (data.data && (data.data.chamados || data.data.corretivas)) || [];
  return raw.map(normalizeCorretivaChamado);
}

function isStatusChamadoAberto(status) {
  const s = String(status || "").trim().toLowerCase();
  return s === "aberto" || s === "em andamento";
}

/* ==========================================================================
   TOAST / NOTIFICAÇÕES
   ========================================================================== */
const toasts = reactive([]);
function pushToast(message, type = "info") {
  const id = uid();
  toasts.push({ id, message, type });
  setTimeout(() => {
    const idx = toasts.findIndex(t => t.id === id);
    if (idx !== -1) toasts.splice(idx, 1);
  }, 4000);
}

const ToastHost = {
  setup() {
    return { toasts };
  },
  template: `
  <div class="fixed top-3 right-3 left-3 sm:left-auto z-[100] flex flex-col gap-2 sm:w-96 pointer-events-none">
    <transition-group name="fade">
      <div v-for="t in toasts" :key="t.id"
        class="pointer-events-auto rounded-xl shadow-lg px-4 py-3 text-sm font-medium border flex items-start gap-2"
        :class="{
          'bg-emerald-50 text-emerald-800 border-emerald-200': t.type === 'success',
          'bg-red-50 text-red-800 border-red-200': t.type === 'error',
          'bg-sky-50 text-sky-800 border-sky-200': t.type === 'info'
        }">
        <span v-if="t.type === 'success'">✅</span>
        <span v-if="t.type === 'error'">⚠️</span>
        <span v-if="t.type === 'info'">ℹ️</span>
        <span>{{ t.message }}</span>
      </div>
    </transition-group>
  </div>`
};

/* ==========================================================================
   TELA DE LOGIN
   ========================================================================== */
const LoginScreen = {
  emits: ["login-success"],
  setup(_, { emit }) {
    const email = ref("");
    const pin = ref("");
    const loading = ref(false);
    const errorMsg = ref("");

    async function handleLogin() {
      errorMsg.value = "";
      if (!email.value.trim() || !pin.value.trim()) {
        errorMsg.value = "Informe e-mail e PIN.";
        return;
      }
      loading.value = true;
      try {
        const data = await getInitialData();
        if (!data || data.status === "error") {
          throw new Error((data && data.message) || "Não foi possível carregar os dados iniciais.");
        }
        const usuarios = data.usuarios || data.Usuarios || (data.data && data.data.usuarios) || [];
        console.log(usuarios);

        const inputEmail = email.value.trim().toLowerCase();
        const inputPin = pin.value.trim().toString();

        const found = usuarios.find(u =>
          (u.Email || u.email || "").toString().trim().toLowerCase() === inputEmail &&
          (u.Senha_PIN || u.Senha || u.senha || u.PIN || u.pin || "").toString().trim() === inputPin
        );

        if (!found) {
          errorMsg.value = "E-mail ou PIN inválidos.";
          loading.value = false;
          return;
        }

        const user = {
          nome: found.Nome || found.nome || found.Name || "Usuário",
          email: found.Email || found.email,
          cargo: found.Cargo || found.cargo || found.Funcao || found.funcao || "",
          area: found.Area || found.area || "",
        };
        localStorage.setItem(STORAGE_USER_KEY, JSON.stringify(user));
        pushToast(`Bem-vindo, ${user.nome}!`, "success");
        emit("login-success", user);
      } catch (err) {
        console.error(err);
        errorMsg.value = err && err.message
          ? err.message
          : "Erro ao conectar com o servidor. Verifique sua conexão e tente novamente.";
      } finally {
        loading.value = false;
      }
    }

    return { email, pin, loading, errorMsg, handleLogin };
  },
  template: `
  <div class="min-h-screen flex items-center justify-center px-4 bg-gradient-to-br from-slate-900 via-slate-800 to-sky-900">
    <div class="w-full max-w-sm">
      <div class="text-center mb-8">
        <div class="mx-auto w-16 h-16 rounded-2xl bg-sky-500 flex items-center justify-center shadow-lg mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-9 h-9 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 21h2m-2-3h2M4 21V9a1 1 0 011-1h3V4a1 1 0 011-1h6a1 1 0 011 1v4h3a1 1 0 011 1v12M9 8h6M9 12h6M9 16h2"/>
          </svg>
        </div>
        <h1 class="text-2xl font-extrabold text-white tracking-tight">Hidrogeron</h1>
        <p class="text-slate-300 text-sm mt-1">Gestão de Manutenção Preventiva e Corretiva</p>
      </div>

      <form @submit.prevent="handleLogin" class="bg-white rounded-2xl shadow-2xl p-6 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">E-mail</label>
          <input v-model="email" type="email" autocomplete="username" placeholder="seuemail@hidrogeron.com"
            class="w-full rounded-xl border border-slate-300 px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">PIN</label>
          <input v-model="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••"
            class="w-full rounded-xl border border-slate-300 px-4 py-3 text-base tracking-widest focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent" />
        </div>

        <p v-if="errorMsg" class="text-red-600 text-sm font-medium">{{ errorMsg }}</p>

        <button type="submit" :disabled="loading"
          class="btn-tap w-full flex items-center justify-center gap-2 bg-sky-600 hover:bg-sky-700 disabled:opacity-60 text-white font-semibold py-3 rounded-xl shadow-md transition-colors">
          <span v-if="loading" class="spinner"></span>
          <span>{{ loading ? "Entrando..." : "Entrar" }}</span>
        </button>
      </form>
      <p class="text-center text-slate-400 text-xs mt-6">© {{ new Date().getFullYear() }} Hidrogeron — Sistema Interno de Manutenção</p>
    </div>
  </div>`
};

/* ==========================================================================
   MÓDULO PREVENTIVA (navegação em 2 níveis: lista de equipamentos → checklist)
   ========================================================================== */
function parseItensInspecao(str) {
  return String(str || "")
    .split(",")
    .map(s => s.trim())
    .filter(Boolean);
}

function normalizeStatusInspecao(s) {
  const v = String(s || "").trim().toLowerCase();
  if (v === "c" || v === "conforme") return "C";
  if (v === "nc" || v === "não conforme" || v === "nao conforme") return "NC";
  if (v === "na" || v === "não aplicável" || v === "nao aplicavel" || v === "não aplicavel") return "NA";
  return null;
}

const PreventivaModule = {
  props: { user: Object },
  setup(props) {
    const areas = AREAS;
    const areaSelecionada = ref(areas[0]);
    const equipamentos = ref([]);
    const preventivasHistorico = ref([]);
    const loadingEquip = ref(false);
    const erroCarregamento = ref("");

    // Nível 1 -> 2
    const view = ref("lista"); // 'lista' | 'detalhe'
    const equipamentoSelecionado = ref(null);
    const itensChecklist = ref([]); // [{ texto, status }]
    const descricaoNC = ref("");
    const observacoesGerais = ref("");
    const fotoBase64 = ref(null);
    const fotoNome = ref("");
    const salvando = ref(false);
    const inputCameraRef = ref(null);
    const inputGaleriaRef = ref(null);

    async function carregarEquipamentos() {
      loadingEquip.value = true;
      erroCarregamento.value = "";
      equipamentos.value = [];
      try {
        const data = await getInitialData();
        const todos = data.equipamentos || data.Equipamentos || (data.data && data.data.equipamentos) || [];
        equipamentos.value = todos.filter(e => {
          const a = String(e.Area || e.area || "").trim().toLowerCase();
          return a === areaSelecionada.value.trim().toLowerCase();
        }).map(e => ({
          id: e.ID || e.Id || e.id || uid(),
          idDisplay: e.ID || e.Id || e.id || "",
          nome: e.Nome || e.Equipamento || e.nome || "Equipamento",
          modelo: e.Modelo || e.modelo || "",
          tag: e.TAG || e.Tag || e.tag || "",
          itensInspecao: e.Itens_Inspecao_Recomendados || e.itens_inspecao_recomendados
            || e.ItensInspecaoRecomendados || e.itensInspecaoRecomendados || "",
        }));
        preventivasHistorico.value = extractPreventivas(data);
      } catch (err) {
        console.error(err);
        erroCarregamento.value = "Não foi possível carregar os equipamentos desta área.";
      } finally {
        loadingEquip.value = false;
      }
    }

    // O log de preventivas não traz o ID do equipamento, então o casamento
    // é feito por nome do equipamento (+ área, quando disponível).
    function ultimaInspecao(eq) {
      let melhor = null;
      const nomeAlvo = String(eq.nome || "").trim().toLowerCase();
      preventivasHistorico.value.forEach(p => {
        const nomeLog = String(p.equipamento || "").trim().toLowerCase();
        if (!nomeLog || nomeLog !== nomeAlvo) return;
        if (p.area && areaSelecionada.value && p.area.trim().toLowerCase() !== areaSelecionada.value.trim().toLowerCase()) return;
        const d = new Date(p.data);
        if (isNaN(d.getTime())) return;
        if (!melhor || d > melhor.dataObj) {
          melhor = { dataObj: d, status: p.status };
        }
      });
      return melhor;
    }

    function formatarStatusLabel(status) {
      if (status === "C") return "Conforme";
      if (status === "NC") return "Não Conforme";
      if (status === "NA") return "Não Aplicável";
      return "—";
    }

    function badgeUltimaInspecao(eq) {
      const info = ultimaInspecao(eq);
      if (!info) return "bg-slate-100 text-slate-500";
      if (info.status === "C") return "bg-emerald-100 text-emerald-700";
      if (info.status === "NC") return "bg-red-100 text-red-700";
      return "bg-slate-100 text-slate-600";
    }

    function formatarData(d) {
      if (!d) return "-";
      const dt = d instanceof Date ? d : new Date(d);
      if (isNaN(dt.getTime())) return String(d);
      return dt.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    }

    function abrirEquipamento(eq) {
      equipamentoSelecionado.value = eq;
      itensChecklist.value = parseItensInspecao(eq.itensInspecao).map(texto => ({ texto, status: null }));
      descricaoNC.value = "";
      observacoesGerais.value = "";
      fotoBase64.value = null;
      fotoNome.value = "";
      view.value = "detalhe";
    }

    function voltarLista() {
      view.value = "lista";
      equipamentoSelecionado.value = null;
      itensChecklist.value = [];
      descricaoNC.value = "";
      observacoesGerais.value = "";
      fotoBase64.value = null;
      fotoNome.value = "";
    }

    function setItemStatus(idx, value) {
      const item = itensChecklist.value[idx];
      item.status = item.status === value ? null : value;
    }

    const temNC = computed(() => itensChecklist.value.some(i => i.status === "NC"));

    const progresso = computed(() => {
      if (itensChecklist.value.length === 0) return 0;
      const preenchidos = itensChecklist.value.filter(i => i.status).length;
      return Math.round((preenchidos / itensChecklist.value.length) * 100);
    });

    function onFotoSelecionada(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        fotoBase64.value = reader.result;
        fotoNome.value = file.name;
      };
      reader.readAsDataURL(file);
      e.target.value = "";
    }

    function removerFoto() {
      fotoBase64.value = null;
      fotoNome.value = "";
    }

    async function salvarInspecao() {
      const pendentes = itensChecklist.value.filter(i => !i.status);
      if (itensChecklist.value.length === 0) {
        pushToast("Este equipamento não possui itens de inspeção cadastrados.", "error");
        return;
      }
      if (pendentes.length > 0) {
        pushToast(`Classifique todos os itens antes de salvar (${pendentes.length} pendente(s)).`, "error");
        return;
      }
      if (temNC.value) {
        if (!descricaoNC.value.trim()) {
          pushToast("Descreva a não conformidade encontrada.", "error");
          return;
        }
        if (!fotoBase64.value) {
          pushToast("Anexe uma foto como evidência da não conformidade.", "error");
          return;
        }
      }
      salvando.value = true;
      try {
        const payload = {
          action: "savePreventiva",
          area: areaSelecionada.value,
          equipamentoId: equipamentoSelecionado.value.idDisplay || equipamentoSelecionado.value.id,
          equipamento: equipamentoSelecionado.value.nome,
          modelo: equipamentoSelecionado.value.modelo,
          tag: equipamentoSelecionado.value.tag,
          responsavel: props.user.nome,
          email: props.user.email,
          data: nowISO(),
          statusGeral: temNC.value ? "Não Conforme" : "Conforme",
          itens: itensChecklist.value.map(i => ({ item: i.texto, status: i.status })),
          descricaoNaoConformidade: temNC.value ? descricaoNC.value.trim() : "",
          fotoBase64: temNC.value ? fotoBase64.value : null,
          fotoNome: temNC.value ? fotoNome.value : "",
          observacoes: observacoesGerais.value.trim(),
        };
        const resp = await apiPost(payload);
        if (resp && resp.status === "error") throw new Error(resp.message || "Erro ao salvar.");
        pushToast("Inspeção registrada com sucesso!", "success");
        voltarLista();
        await carregarEquipamentos();
      } catch (err) {
        console.error(err);
        pushToast("Erro ao salvar inspeção. Tente novamente.", "error");
      } finally {
        salvando.value = false;
      }
    }

    onMounted(carregarEquipamentos);
    watch(areaSelecionada, carregarEquipamentos);

    return {
      areas, areaSelecionada, equipamentos, loadingEquip, erroCarregamento,
      view, equipamentoSelecionado, itensChecklist, temNC, progresso,
      descricaoNC, observacoesGerais, fotoBase64, fotoNome, salvando,
      inputCameraRef, inputGaleriaRef,
      abrirEquipamento, voltarLista, setItemStatus, onFotoSelecionada, removerFoto, salvarInspecao,
      ultimaInspecao, formatarStatusLabel, badgeUltimaInspecao, formatarData,
    };
  },
  template: `
  <div class="space-y-5">
    <!-- NÍVEL 1: seleção de área + lista de equipamentos -->
    <template v-if="view === 'lista'">
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Área</label>
        <div class="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1">
          <button v-for="a in areas" :key="a" @click="areaSelecionada = a"
            class="btn-tap whitespace-nowrap px-4 py-2 rounded-full text-sm font-semibold border transition-colors"
            :class="areaSelecionada === a ? 'bg-sky-600 border-sky-600 text-white shadow' : 'bg-white border-slate-300 text-slate-600'">
            {{ a }}
          </button>
        </div>
      </div>

      <div v-if="loadingEquip" class="flex justify-center py-12 text-slate-400">
        <span class="spinner !border-slate-300 !border-t-sky-600"></span>
      </div>

      <div v-else-if="erroCarregamento" class="bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 text-sm">
        {{ erroCarregamento }}
      </div>

      <div v-else-if="equipamentos.length === 0" class="bg-white border border-dashed border-slate-300 rounded-xl p-8 text-center text-slate-400">
        Nenhum equipamento cadastrado para esta área.
      </div>

      <div v-else class="space-y-3">
        <button v-for="eq in equipamentos" :key="eq.id" @click="abrirEquipamento(eq)"
          class="w-full text-left btn-tap bg-white rounded-xl border border-slate-200 p-4 shadow-sm hover:border-sky-300 hover:shadow-md transition-all flex items-center justify-between gap-3">
          <div class="min-w-0">
            <p class="font-semibold text-slate-800 truncate">
              <span v-if="eq.idDisplay" class="text-slate-400 font-mono text-sm mr-1">[{{ eq.idDisplay }}]</span>{{ eq.nome }}<span v-if="eq.modelo" class="text-slate-400 font-normal"> — {{ eq.modelo }}</span>
            </p>

/* ==========================================================================
   MÓDULO CORRETIVA
   ========================================================================== */
const CorretivaModule = {
  props: { user: Object },
  setup(props) {
    const areas = AREAS;
    const prioridades = PRIORIDADES;
    const form = reactive({
      area: areas[0],
      equipamento: "",
      prioridade: "Média",
      descricao: "",
    });
    const enviando = ref(false);
    const chamados = ref([]);
    const chamadosEncerrados = ref([]);
    const loadingChamados = ref(true);
    const erroChamados = ref("");
    const aba = ref("abertos"); // 'abertos' | 'encerrados'

    // Modal de atendimento/encerramento
    const modalAberto = ref(false);
    const chamadoSelecionado = ref(null);
    const resolucaoTexto = ref("");
    const fotoConclusaoBase64 = ref(null);
    const fotoConclusaoNome = ref("");
    const encerrando = ref(false);
    const inputCameraConclusaoRef = ref(null);
    const inputGaleriaConclusaoRef = ref(null);

    async function carregarChamados() {
      loadingChamados.value = true;
      erroChamados.value = "";
      try {
        const data = await getInitialData();
        const todos = extractCorretivas(data);
        chamados.value = todos
          .filter(c => isStatusChamadoAberto(c.status))
          .sort((a, b) => new Date(b.data) - new Date(a.data));
        chamadosEncerrados.value = todos
          .filter(c => !isStatusChamadoAberto(c.status))
          .sort((a, b) => new Date(b.dataConclusao || b.data) - new Date(a.dataConclusao || a.data));
      } catch (err) {
        console.error(err);
        erroChamados.value = "Não foi possível carregar os chamados abertos.";
      } finally {
        loadingChamados.value = false;
      }
    }

    async function abrirChamado() {
      if (!form.equipamento.trim()) {
        pushToast("Informe o equipamento com falha.", "error");
        return;
      }
      if (!form.descricao.trim()) {
        pushToast("Descreva a falha observada.", "error");
        return;
      }
      enviando.value = true;
      try {
        const dataAbertura = new Date().toISOString().replace("T", " ").substring(0, 16);
        const payload = {
          action: "saveCorretiva",
          area: form.area,
          equipamento: form.equipamento.trim(),
          descricaoProblema: form.descricao.trim(),
          prioridade: form.prioridade,
          solicitante: props.user.nome || "Produção",
          dataAbertura,
        };
        const resp = await apiPost(payload);
        if (resp && resp.status === "error") throw new Error(resp.message || "Erro ao salvar.");

        form.equipamento = "";
        form.descricao = "";
        form.prioridade = "Média";

        // Feedback visual instantâneo: insere o chamado localmente antes de resincronizar com a planilha.
        chamados.value.unshift({
          id: (resp && (resp.id || resp.ID)) || uid(),
          area: payload.area,
          equipamento: payload.equipamento,
          descricao: payload.descricaoProblema,
          prioridade: payload.prioridade,
          solicitante: payload.solicitante,
          status: "Aberto",
          data: dataAbertura,
        });

        pushToast("Chamado aberto com sucesso!", "success");
        await carregarChamados();
      } catch (err) {
        console.error(err);
        pushToast("Erro ao abrir chamado. Tente novamente.", "error");
      } finally {
        enviando.value = false;
      }
    }

    function abrirModalEncerramento(chamado) {
      chamadoSelecionado.value = chamado;
      resolucaoTexto.value = "";
      fotoConclusaoBase64.value = null;
      fotoConclusaoNome.value = "";
      modalAberto.value = true;
    }

    function fecharModal() {
      if (encerrando.value) return;
      modalAberto.value = false;
      chamadoSelecionado.value = null;
    }

    function onFotoConclusaoSelecionada(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        fotoConclusaoBase64.value = reader.result;
        fotoConclusaoNome.value = file.name;
      };
      reader.readAsDataURL(file);
      e.target.value = "";
    }

    function removerFotoConclusao() {
      fotoConclusaoBase64.value = null;
      fotoConclusaoNome.value = "";
    }

    async function confirmarEncerramento() {
      if (!resolucaoTexto.value.trim()) {
        pushToast("Descreva as ações realizadas para encerrar o chamado.", "error");
        return;
      }
      const chamado = chamadoSelecionado.value;
      encerrando.value = true;
      try {
        const dataFechamento = new Date().toISOString().replace("T", " ").substring(0, 16);
        const payload = {
          action: "closeCorretiva",
          idChamado: chamado.id,
          tecnico: props.user.nome || "Produção",
          resolucao: resolucaoTexto.value.trim(),
          dataFechamento,
          fotoConclusaoBase64: fotoConclusaoBase64.value || null,
          fotoConclusaoNome: fotoConclusaoNome.value || "",
        };
        const resp = await apiPost(payload);
        if (resp && resp.status === "error") throw new Error(resp.message || "Erro ao encerrar.");

        // Move o chamado de "abertos" para "encerrados" localmente para feedback instantâneo.
        chamados.value = chamados.value.filter(c => c.id !== chamado.id);
        chamadosEncerrados.value.unshift({
          ...chamado,
          status: "Concluído",
          resolucao: payload.resolucao,
          tecnico: payload.tecnico,
          dataConclusao: dataFechamento,
        });

        pushToast(`Chamado #${chamado.id} encerrado com sucesso!`, "success");
        modalAberto.value = false;
        chamadoSelecionado.value = null;
        await carregarChamados();
      } catch (err) {
        console.error(err);
        pushToast("Erro ao encerrar o chamado. Tente novamente.", "error");
      } finally {
        encerrando.value = false;
      }
    }

    function corPrioridade(p) {
      const found = prioridades.find(x => x.value === p);
      return found ? found.color : "bg-slate-100 text-slate-700 border-slate-300";
    }

    function formatarData(iso) {
      if (!iso) return "-";
      const d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      return d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    }

    onMounted(carregarChamados);

    return {
      areas, prioridades, form, enviando, abrirChamado,
      chamados, chamadosEncerrados, loadingChamados, erroChamados, aba, corPrioridade, formatarData, carregarChamados,
      modalAberto, chamadoSelecionado, resolucaoTexto, fotoConclusaoBase64, fotoConclusaoNome, encerrando,
      inputCameraConclusaoRef, inputGaleriaConclusaoRef,
      abrirModalEncerramento, fecharModal, onFotoConclusaoSelecionada, removerFotoConclusao, confirmarEncerramento,
    };
  },
  template: `

/* ==========================================================================
   MÓDULO DASHBOARD / HISTÓRICO
   ========================================================================== */
const DashboardModule = {
  setup() {
    const loading = ref(true);
    const erro = ref("");
    const preventivas = ref([]);
    const corretivas = ref([]);
    const filtroTipo = ref("todos");

    const stats = computed(() => {
      const abertos = corretivas.value.filter(c => isStatusChamadoAberto(c.status)).length;
      const criticos = corretivas.value.filter(c => c.prioridade === "Crítica" && isStatusChamadoAberto(c.status)).length;
      const naoConformes = preventivas.value.filter(p => p.status === "NC").length;
      return {
        totalPreventivas: preventivas.value.length,
        totalCorretivas: corretivas.value.length,
        abertos,
        criticos,
        naoConformes,
      };
    });

    const historico = computed(() => {
      const p = preventivas.value.map(x => ({
        tipo: "Preventiva",
        titulo: `${x.equipamento ? x.equipamento + " - " : ""}${x.area || ""}`,
        subtitulo: x.usuario || "",
        data: x.data,
        badge: x.status === "NC" ? "Não Conforme" : x.status === "NA" ? "Não Aplicável" : "Conforme",
        badgeColor: x.status === "NC" ? "bg-red-100 text-red-700" : "bg-emerald-100 text-emerald-700",
      }));
      const c = corretivas.value.map(x => ({
        tipo: "Corretiva",
        titulo: `${x.equipamento || ""} (${x.area || ""})`,
        subtitulo: x.solicitante || "",
        data: x.data,
        badge: x.status || x.prioridade,
        badgeColor: String(x.status).toLowerCase() === "aberto" ? "bg-orange-100 text-orange-700" : "bg-slate-100 text-slate-600",
      }));
      let all = [...p, ...c];
      if (filtroTipo.value !== "todos") {
        all = all.filter(item => item.tipo.toLowerCase() === filtroTipo.value);
      }
      return all.sort((a, b) => new Date(b.data) - new Date(a.data)).slice(0, 50);
    });

    async function carregar() {
      loading.value = true;
      erro.value = "";
      try {
        const data = await getInitialData();
        preventivas.value = extractPreventivas(data);
        corretivas.value = extractCorretivas(data);
      } catch (err) {
        console.error(err);
        erro.value = "Não foi possível carregar o histórico.";
      } finally {
        loading.value = false;
      }
    }

    function formatarData(iso) {
      if (!iso) return "-";
      const d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      return d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    }

    onMounted(carregar);

    return { loading, erro, stats, historico, filtroTipo, carregar, formatarData };
  },
  template: `
  <div class="space-y-5">
    <div v-if="loading" class="flex justify-center py-12 text-slate-400">
      <span class="spinner !border-slate-300 !border-t-sky-600"></span>
    </div>

    <div v-else-if="erro" class="bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 text-sm">
      {{ erro }}
    </div>

    <template v-else>
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <p class="text-xs text-slate-400 font-semibold uppercase">Chamados Abertos</p>
          <p class="text-3xl font-extrabold text-orange-600 mt-1">{{ stats.abertos }}</p>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <p class="text-xs text-slate-400 font-semibold uppercase">Críticos</p>
          <p class="text-3xl font-extrabold text-red-600 mt-1">{{ stats.criticos }}</p>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <p class="text-xs text-slate-400 font-semibold uppercase">Não Conformes</p>
          <p class="text-3xl font-extrabold text-amber-600 mt-1">{{ stats.naoConformes }}</p>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <p class="text-xs text-slate-400 font-semibold uppercase">Checklists Feitos</p>
          <p class="text-3xl font-extrabold text-emerald-600 mt-1">{{ stats.totalPreventivas }}</p>
        </div>
      </div>

      <div class="flex items-center justify-between">
        <h3 class="font-bold text-slate-700">Histórico de Atividades</h3>
        <button @click="carregar" class="text-sky-600 text-sm font-semibold btn-tap">↻ Atualizar</button>
      </div>

      <div class="flex gap-2">
        <button v-for="f in [{v:'todos', l:'Todos'}, {v:'preventiva', l:'Preventiva'}, {v:'corretiva', l:'Corretiva'}]" :key="f.v"
          @click="filtroTipo = f.v"
          class="btn-tap px-3 py-1.5 rounded-full text-xs font-semibold border"
          :class="filtroTipo === f.v ? 'bg-slate-800 border-slate-800 text-white' : 'bg-white border-slate-300 text-slate-500'">
          {{ f.l }}
        </button>
      </div>

      <div v-if="historico.length === 0" class="bg-white border border-dashed border-slate-300 rounded-xl p-8 text-center text-slate-400">
        Nenhum registro encontrado.
      </div>
      <div v-else class="space-y-2">
        <div v-for="(h, idx) in historico" :key="idx" class="bg-white rounded-xl border border-slate-200 p-3.5 shadow-sm flex items-center justify-between gap-2">
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <span class="text-[10px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded"
                :class="h.tipo === 'Preventiva' ? 'bg-sky-100 text-sky-700' : 'bg-orange-100 text-orange-700'">
                {{ h.tipo }}
              </span>
              <p class="font-semibold text-slate-800 truncate">{{ h.titulo }}</p>
            </div>
            <p class="text-xs text-slate-400 mt-0.5">{{ h.subtitulo }} · {{ formatarData(h.data) }}</p>
          </div>
          <span class="text-xs font-bold px-2 py-1 rounded-full whitespace-nowrap" :class="h.badgeColor">{{ h.badge }}</span>
        </div>
      </div>
    </template>
  </div>`
};

/* ==========================================================================
   MÓDULO INDICADORES (KPIs)
   ========================================================================== */
const IndicadoresModule = {
  setup() {
    const loading = ref(true);
    const erro = ref("");
    const preventivas = ref([]);
    const corretivas = ref([]);

    function parseData(v) {
      const d = new Date(v);
      return isNaN(d.getTime()) ? null : d;
    }

    async function carregar() {
      loading.value = true;
      erro.value = "";
      try {
        const data = await getInitialData();
        preventivas.value = extractPreventivas(data);
        corretivas.value = extractCorretivas(data);
      } catch (err) {
        console.error(err);
        erro.value = "Não foi possível carregar os indicadores.";
      } finally {
        loading.value = false;
      }
    }

    const conformidade = computed(() => {
      const c = preventivas.value.filter(p => p.status === "C").length;
      const nc = preventivas.value.filter(p => p.status === "NC").length;
      const total = c + nc;
      return total === 0 ? null : Math.round((c / total) * 100);
    });

    const mtbf = computed(() => {
      const datas = corretivas.value.map(c => parseData(c.data)).filter(Boolean).sort((a, b) => a - b);
      if (datas.length < 2) return null;
      let totalMs = 0;
      for (let i = 1; i < datas.length; i++) totalMs += (datas[i] - datas[i - 1]);
      return totalMs / (datas.length - 1) / 36e5; // horas
    });

    const mttr = computed(() => {
      const pares = corretivas.value
        .map(c => ({ abertura: parseData(c.data), conclusao: parseData(c.dataConclusao) }))
        .filter(p => p.abertura && p.conclusao && p.conclusao >= p.abertura);
      if (pares.length === 0) return null;
      const totalMs = pares.reduce((acc, p) => acc + (p.conclusao - p.abertura), 0);
      return totalMs / pares.length / 36e5; // horas
    });

    const historico = computed(() => {
      const p = preventivas.value.map(x => ({ tipo: "Preventiva", titulo: `${x.equipamento || ""} (${x.area || ""})`, data: x.data }));
      const c = corretivas.value.map(x => ({ tipo: "Corretiva", titulo: `${x.equipamento || ""} (${x.area || ""})`, data: x.data }));
      return [...p, ...c].sort((a, b) => new Date(b.data) - new Date(a.data)).slice(0, 8);
    });

    function formatarHoras(h) {
      if (h === null) return "—";
      return h < 24 ? h.toFixed(1) + "h" : (h / 24).toFixed(1) + "d";
    }

    function formatarData(iso) {
      if (!iso) return "-";
      const d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      return d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    }

    onMounted(carregar);

    return { loading, erro, conformidade, mtbf, mttr, historico, formatarHoras, formatarData, carregar };
  },
  template: `
  <div class="space-y-5">
    <div v-if="loading" class="flex justify-center py-12 text-slate-400">
      <span class="spinner !border-slate-300 !border-t-sky-600"></span>
    </div>
    <div v-else-if="erro" class="bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 text-sm">{{ erro }}</div>
    <template v-else>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <p class="text-xs text-slate-400 font-semibold uppercase">Conformidade</p>
          <p class="text-3xl font-extrabold text-emerald-600 mt-1">{{ conformidade === null ? "—" : conformidade + "%" }}</p>
          <p class="text-[11px] text-slate-400 mt-1">Itens conformes / avaliados</p>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <p class="text-xs text-slate-400 font-semibold uppercase">MTBF</p>
          <p class="text-3xl font-extrabold text-sky-600 mt-1">{{ formatarHoras(mtbf) }}</p>
          <p class="text-[11px] text-slate-400 mt-1">Tempo médio entre falhas</p>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <p class="text-xs text-slate-400 font-semibold uppercase">MTTR</p>
          <p class="text-3xl font-extrabold text-orange-600 mt-1">{{ formatarHoras(mttr) }}</p>
          <p class="text-[11px] text-slate-400 mt-1">Tempo médio de reparo</p>
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-bold text-slate-700">Histórico de Intervenções</h3>
          <button @click="carregar" class="text-sky-600 text-sm font-semibold btn-tap">↻ Atualizar</button>
        </div>
        <div v-if="historico.length === 0" class="bg-white border border-dashed border-slate-300 rounded-xl p-8 text-center text-slate-400">
          Nenhum registro encontrado.
        </div>
        <div v-else class="space-y-2">
          <div v-for="(h, idx) in historico" :key="idx" class="bg-white rounded-xl border border-slate-200 p-3.5 shadow-sm flex items-center justify-between gap-2">
            <div class="min-w-0">
              <span class="text-[10px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded mr-2"
                :class="h.tipo === 'Preventiva' ? 'bg-sky-100 text-sky-700' : 'bg-orange-100 text-orange-700'">{{ h.tipo }}</span>
              <span class="font-semibold text-slate-800">{{ h.titulo }}</span>
            </div>
            <span class="text-xs text-slate-400 whitespace-nowrap">{{ formatarData(h.data) }}</span>
          </div>
        </div>
      </div>
    </template>
  </div>`
};

          <preventiva-module v-else-if="currentView === 'preventiva'" :user="user" key="prev"></preventiva-module>
          <corretiva-module v-else-if="currentView === 'corretiva'" :user="user" key="corr"></corretiva-module>
          <indicadores-module v-else-if="currentView === 'indicadores'" key="ind"></indicadores-module>
          <dashboard-module v-else key="dash"></dashboard-module>
        </transition>
      </main>
    </div>
  </div>`
};

createApp(App).mount("#app");
</script>
</body>
